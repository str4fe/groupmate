services:
  app:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://attendance:change-me@db:5432/attendance}
      TIMEZONE: ${TIMEZONE:-UTC}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-your-env}
      APP_NAME: ${APP_NAME:-University Attendance}
      DEBUG: ${DEBUG:-false}
      DEBUG_AUTH: ${DEBUG_AUTH:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://attendance:change-me@db:5432/attendance}
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-your-env}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:8000}
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.bot.main"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
